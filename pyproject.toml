[project]
name = "evidencepilot"
version = "0.2.0"
description = "A verifiable deep-research agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "markdown-it-py>=3,<5",
  "openai>=1.40,<3",
  "pypdf>=5,<7",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "streamlit>=1.37,<2",
  "tavily-python>=0.5,<1",
]

[project.scripts]
evidencepilot = "evidencepilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in tests that call paid external APIs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
